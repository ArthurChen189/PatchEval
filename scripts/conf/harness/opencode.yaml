name: opencode
# Pinned OpenCode, vendored under third_party/opencode/<version>/ and extracted
# from its .xz archive (checksum-verified) on first use. OPENCODE_BIN overrides it -- this ensure that we use the same version of the opencode across all evaluation runs.
binary: ${repo:}/third_party/opencode/1.18.31/opencode-linux-x64
# Generation refuses a binary that reports another version; null disables the check.
version: 1.18.31
config: null
