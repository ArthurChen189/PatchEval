name: opencode
# Pinned OpenCode, vendored under third_party/opencode/<version>/ and extracted
# from its .xz archive (checksum-verified) on first use. OPENCODE_BIN overrides it;
# keep the default so every evaluation run uses the same OpenCode release.
binary: ${oc.env:OPENCODE_BIN,${repo:}/third_party/opencode/1.18.31/opencode-linux-x64}
# Generation refuses a binary that reports another version; null disables the check.
# Keep in sync with OPENCODE_PINNED_VERSION in patcheval/exp_agent/agents/opencode.sh.
version: 1.18.31
config: null
# Optional rules/skills profile: <dir>/config/ is copied into the rendered OpenCode
# config directory (e.g. harness=opencode_secpatch). null renders the plain config.
profile: null
# OpenCode's grep, glob, and skill tools need ripgrep, which OpenCode downloads on first use;
# offline agent containers cannot, so this pinned static binary is mounted at /usr/local/bin/rg
# (third_party/ripgrep/15.1.0/README.md). null reproduces runs made before 2026-10-06.
ripgrep: ${repo:}/third_party/ripgrep/15.1.0/rg
# Continue a session up to this many times when a response ends at the output-token limit
# before calling a tool (patcheval/exp_agent/container/opencode_continue.sh). 0 = off.
continue_on_length: 0
