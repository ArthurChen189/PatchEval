defaults:
  - model: qwen3_8_27b
  - harness: codex
  - _self_
  - optional experiment: null

# setup | serve | configure | check | generate | evaluate | analyze
action: check
dry_run: false
label: local_${harness.name}

paths:
  runtime: ${oc.env:RUNTIME_DIR,${oc.env:HOME}/.cache/patcheval/local_llm} # Separate serving home (venv, caches, ~54 GB); RUNTIME_DIR or Hydra override.
  runs: ${repo:}/patcheval/exp_agent/agent_runs # Hydra jobs and generation runs; evaluation searches here when run_dir is null.
  dataset: ${repo:}/patcheval/datasets/patcheval_verified.json # 230 verified CVE cases for generation and evaluation.
  serving_env: ${paths.runtime}/venv-vllm # Isolated uv venv with pinned vLLM; created by action=setup.
  hf_cache: ${oc.env:HF_HOME,${paths.runtime}/huggingface} # Hugging Face model cache; HF_HOME or Hydra override.
  uv_cache: ${paths.runtime}/uv-cache # uv download cache used during setup (UV_CACHE_DIR).
  python_install: ${paths.runtime}/python # Managed CPython 3.12 plus headers required by Triton.

server:
  version: 0.29.0
  python_version: '3.12'
  gpu: '0,1,2,3,4,5,6,7' # CUDA_VISIBLE_DEVICES; 8 H200s for data-parallel replicas.
  host: null # Discover the Docker bridge gateway only when needed.
  port: 30000
  base_url: null # Override the client URL if different from the bind address.
  tensor_parallel: 1 # 27B BF16 fits on one H200; do not shard the model.
  data_parallel: 8 # One full replica per GPU (--data-parallel-size); better throughput than TP.
  dtype: bfloat16
  memory_fraction: 0.85
  # Per replica (--max-num-seqs). BF16 KV costs 64 KiB/token (16 full-attention
  # layers x 4 KV heads x 256 dims), leaving ~900k tokens per H200 after weights;
  # 8 sessions at the measured ~72k median peak context fit with headroom.
  max_running_requests: 8
  # Lossless speedups. MTP drafts with the checkpoint's own MTP layer and
  # rejection sampling keeps the output distribution unchanged; null disables.
  speculative:
    method: mtp
    num_speculative_tokens: 3
  prefix_caching: true # Reuse KV (and Mamba "align" states) across agent turns.
  chunked_prefill: true # Interleave long prompt prefill with decoding.
  extra_args: [] # Literal argv entries, never evaluated by a shell.

configure:
  output_dir: null # Default: this Hydra invocation / harnesses.
  force: false

check:
  protocol: both
  timeout: 300

generation:
  limit: -1
  concurrency: 1
  timeout: 2400 # Agent wall-clock budget per task in seconds (40 minutes).
  samples: 4 # Independent generation runs per case; evaluation reports pass@1..pass@samples.
  resume_dir: null # A previous generation invocation: generate only its missing samples, with its settings.
  save_trajectories: true # Preserve per-task prompts, events, stderr, and native sessions.

analysis:
  input_dir: null # Generation run, benchmark folder, or one archived task.
  output_dir: null # Default: this Hydra invocation / analysis; must be a new directory.

evaluation:
  run_dir: null # null selects the newest completed run matching label under paths.runs.
  max_workers: 1
  log_level: INFO
  allow_partial: false # Score only completed samples when some are missing (marked partial).

hydra:
  job:
    chdir: false
  run:
    # e.g. <time>-generate-codex-<label>, <time>-evaluate-<generation folder>, <time>-resume-<folder>.
    dir: ${absolute:${paths.runs}}/hydra/${now:%Y%m%d_%H%M%S_%f}-${run_name:${action},${harness.name},${label},${evaluation.run_dir},${generation.resume_dir}}
  sweep:
    dir: ${absolute:${paths.runs}}/hydra/multirun/${now:%Y%m%d_%H%M%S_%f}
    subdir: ${hydra.job.num}
